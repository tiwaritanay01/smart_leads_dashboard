name: Build & Push Backend Image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/smart-leads-backend:${{ github.sha }} -f backend/Dockerfile backend

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}/smart-leads-backend:${{ github.sha }}
          echo "IMAGE=ghcr.io/${{ github.repository }}/smart-leads-backend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Trigger Render deploy (optional)
        if: ${{ secrets.RENDER_SERVICE_ID && secrets.RENDER_API_KEY }}
        run: |
          # If you use Render and have set RENDER_SERVICE_ID and RENDER_API_KEY
          # this will request a manual deploy via the Render API. If not set,
          # connect your repo to Render directly and point it to this repo.
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H 'Content-Type: application/json' \
            -d '{"type":"manual"}'
