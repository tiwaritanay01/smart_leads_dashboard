services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: smart_leads_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: smart_leads
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_leads_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # MONGO_URI: mongodb://mongodb:27017/smart_leads
      MONGO_URI: mongodb+srv://smart_leads_admin:smart123@cluster0.whp9cs1.mongodb.net/?appName=Cluster0
      JWT_SECRET: b072e1cbd59f1dafdbb1c365a5bf43fd0e6779d074e4e000978ebb84f791f3bb
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-70d}
    ports:
      - "5000:5000"
    networks:
      - app_network

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_leads_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app_network

# ── Volumes & Networks ────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

networks:
  app_network:
    driver: bridge
