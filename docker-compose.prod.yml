version: '3.8'
services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart_leads_backend:latest
    env_file:
      - ./backend/.env.production
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smart_leads_frontend:latest
    env_file:
      - ./frontend/.env.production
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
